schema_version: 1
label: custom-pcap
event_id: custom
source_mode: pcap_replay

transport:
  type: loom

slice:
  name: dune-udp-demo-rebuild-2
  sender_node: sender
  receiver_node: receiver

network:
  sender_interface: enp7s0
  receiver_interface: enp7s0
  capture_filter: udp and dst port 2049
  expected_sender_ip: ""
  expected_receiver_ip: ""

paths:
  output_root: /tmp/dune_fabric_live_demo
  receiver_root: /home/ubuntu
  sender_root: /home/ubuntu
  wibviz_src: /home/ubuntu/wibviz_graph/src
  mapping_csv: /home/ubuntu/wibviz_inputs/event-4245-channel-map.csv

pcap_replay:
  sender_pcap: /home/ubuntu/dune-replay/pcap/replace-me.pcap
  replay_timing: pps
  pps: 50
  packet_limit: null
  tcpreplay_extra_args: []

decode:
  tpc: 0
  plane: all
  chunking:
    mode: fixed_packet_count
    chunk_packets: 64
  queue:
    implementation: queue_v2
    decode_workers: 1
  adaptive:
    enabled: false
    experimental: true
    min_chunk_packets: 32
    max_chunk_packets: 256

visualization:
  enabled: true
  outputs:
    - heatmap
    - stacked_waveform
  max_rows: 500000

validation:
  enabled: false
  reference_csv: ""
  compare_fields: ""
  expected_packets: null
  expected_rows: null

