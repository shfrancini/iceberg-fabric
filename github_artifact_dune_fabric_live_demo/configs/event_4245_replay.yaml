schema_version: 1
label: event-4245
event_id: "4245"
source_mode: pcap_replay

transport:
  type: loom

slice:
  name: dune-udp-demo-rebuild-2
  sender_node: sender
  receiver_node: receiver

network:
  sender_interface: enp7s0
  receiver_interface: enp7s0
  capture_filter: udp and dst port 2049
  expected_sender_ip: 192.168.1.1/24
  expected_receiver_ip: 192.168.1.2/24

paths:
  output_root: /tmp/dune_fabric_live_demo
  receiver_root: /home/ubuntu
  sender_root: /home/ubuntu
  wibviz_src: /home/ubuntu/wibviz_graph/src
  mapping_csv: /home/ubuntu/wibviz_inputs/event-4245-channel-map.csv

pcap_replay:
  sender_pcap: /home/ubuntu/dune-replay/pcap/icecosmich_run82134054_sub001_evt004245.pcap
  replay_timing: pps
  pps: 50
  packet_limit: 640
  tcpreplay_extra_args: []

decode:
  tpc: 0
  plane: 0
  chunking:
    mode: fixed_packet_count
    chunk_packets: 64
  queue:
    implementation: queue_v2
    decode_workers: 1
  adaptive:
    enabled: false
    experimental: true
    min_chunk_packets: 32
    max_chunk_packets: 256

visualization:
  enabled: true
  outputs:
    - heatmap
    - stacked_waveform
  max_rows: 500000

validation:
  enabled: true
  reference_csv: /home/ubuntu/wibviz_inputs/4245.csv
  compare_fields: seq_id,timestamp,tick,adc_value,wire_id,tpc,slot,plane
  expected_packets: 640
  expected_rows: 409600

