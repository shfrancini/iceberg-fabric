# SSH template for live NIC capture from standard FABRIC or local Jupyter.
# Copy this file before editing:
#   cp configs/live_nic_ssh_template.yaml configs/live_nic_ssh.yaml
# Then edit the copied file. Do not run live capture against the template
# placeholders.
#
# Required transport fields:
# - username: VM login user, commonly ubuntu for FABRIC images.
# - receiver_host: receiver VM management IP, DNS name, or SSH config Host alias.
# - sender_host: unused for live_nic; leave empty unless changing source_mode.
# - ssh_key: private key path from the Jupyter/local machine. Leave empty if
#   IdentityFile is already supplied by ssh_options -F /path/to/ssh_config.
# - ssh_options: extra arguments passed before user@host. Use this for FABRIC
#   generated SSH configs, ProxyJump/-J bastions, BatchMode, or host-key policy.
# - copy_tool: scp by default; rsync is supported only if available locally and
#   on the target VM.
#
# Local/remote path rule:
# - paths.output_root is local to the machine running this notebook/runner.
# - paths.receiver_root, paths.wibviz_src, and paths.mapping_csv are receiver VM
#   paths.
# - live_nic.stop_file is a receiver VM path.
schema_version: 1
label: live-nic
event_id: live
source_mode: live_nic

transport:
  type: ssh
  username: ubuntu
  sender_host: ""
  receiver_host: replace-with-receiver-management-ip-or-dns
  ssh_key: ~/.ssh/fabric_slice_key
  ssh_options:
    - -o
    - BatchMode=yes
    - -o
    - StrictHostKeyChecking=accept-new
    # FABRIC-generated SSH config example:
    # - -F
    # - /path/to/fabric_ssh_config
    # Direct ProxyJump example:
    # - -J
    # - bastion.example.org
  copy_tool: scp

slice:
  # name is informational for SSH transport; receiver_node is the logical key
  # that maps to receiver_host above.
  name: dune-udp-demo-rebuild-2
  sender_node: ""
  receiver_node: receiver

network:
  sender_interface: ""
  # Interface that already receives live packets inside the receiver VM. Update
  # after checking `ip -brief addr` on the receiver.
  receiver_interface: enp7s0
  capture_filter: udp and dst port 2049
  expected_sender_ip: ""
  expected_receiver_ip: ""

paths:
  # Local to the Jupyter/runner machine. Use /tmp or local scratch, not a small
  # shared workspace, for large run products.
  output_root: /tmp/dune_fabric_live_demo
  receiver_root: /home/ubuntu
  sender_root: /home/ubuntu
  # Receiver VM must already contain this WIBViz source tree and mapping CSV.
  wibviz_src: /home/ubuntu/wibviz_graph/src
  mapping_csv: /home/ubuntu/wibviz_inputs/event-4245-channel-map.csv

live_nic:
  chunk_seconds: 5
  max_chunks: null
  # Receiver VM path. For --follow runs, create this file on the receiver to stop.
  stop_file: /tmp/dune_fabric_live_demo.stop
  require_follow_for_unbounded: true

decode:
  tpc: 0
  plane: all
  chunking:
    mode: rolling_time_window
    chunk_packets: null
  queue:
    implementation: queue_v2
    decode_workers: 1
  adaptive:
    enabled: false
    experimental: true
    min_chunk_packets: 32
    max_chunk_packets: 256

visualization:
  enabled: true
  outputs:
    - heatmap
    - stacked_waveform
  max_rows: 500000

validation:
  enabled: false
  reference_csv: ""
  compare_fields: ""
  expected_packets: null
  expected_rows: null
